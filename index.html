<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Videojuegos</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav>
        <input type="text" id="buscador" placeholder="Buscar Videojuego...">
        <button id="btnBuscar">Buscar</button>
        <button id="btnOrdenar">Ordenar por valoracion</button>
    </nav>
    <h1>Biblioteca de Videojuegos</h1>
    <section id="estadisticas" style="margin: 20px 0; padding: 15px; background: #f0f0f0; border-radius: 8px;">
        <h3>Estadísticas</h3>
        <p><strong>Total de horas jugadas:</strong> <span id="totalHoras">0</span></p>
        <p><strong>Géneros únicos:</strong> <span id="generosUnicos">Ninguno</span></p>
        <p><strong>Juegos por plataforma:</strong> <span id="plataformas">Ninguna</span></p>
    </section>
    <br>
    <h1>Formulario para añadir videojuegos</h1>
    <br>
    <button id="btnMostrarFormulario">Añadir Videojuegos</button>

    <section id="formularioContainer" hidden>
        <form id="formVideojuego">
            <input type="text" id="titulo" placeholder="Titulo" required>
            <input type="text" id="genero" placeholder="Genero" required>
            <input type="text" id="empresa" placeholder="Empresa" required>
            <input type="text" id="plataforma" placeholder="Plataforma" required>
            <input type="number" id="tiempoJugado" placeholder="Horas jugadas" required>
            <input type="number" id="valoracion" min="1" max="5" placeholder="Valoracion" required>
            <input type="text" id="portada" placeholder="Portada">

            <button type="submit">Guardar</button>
        </form>
    </section>
    <section id="biblioteca"></section>
    <script type="module" src="js/main.js"></script>
</body>

</html>
